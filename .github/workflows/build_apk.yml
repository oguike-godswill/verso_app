name: Build Marginalia APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: marginalia-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Marginalia ${{ github.ref_name }}
          body: |
            ## Marginalia - Release APK
            - **App Name:** Marginalia (Quiet Literary Exhibit & Commonplace Book)
            - **Custom Logo:** Signature cobalt arch, full moon, white cottage, and red tree
            - **Key Features:** Daily Quiet Writing Prompt, Midnight Reading Lamp, Drifting Lake Bottles, Tactile Audio, Printable Chapbook Mini-Zine
            - **Database:** Authoritative Neon PostgreSQL cloud sync
          draft: false
          prerelease: false
